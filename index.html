<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Design &amp; Development Services | New Fleet Solutions</title>
    <meta
      name="description"
      content="Get professional website design and development services from New Fleet Solutions. Affordable single-page websites starting at $300 and multi-page websites at $600, with responsive design and on-page SEO included."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="New Fleet Solutions" />
    <meta name="theme-color" content="#1B1A66" />

    <!-- Google Search Console Verification Ready (replace content with your verification token) -->
    <!-- <meta name="google-site-verification" content="YOUR_SEARCH_CONSOLE_VERIFICATION_CODE" /> -->

    <!-- Open Graph / Social Media Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="New Fleet Solutions" />
    <meta property="og:title" content="Website Design &amp; Development Services | New Fleet Solutions" />
    <meta
      property="og:description"
      content="Get professional website design and development services from New Fleet Solutions. Affordable single-page websites starting at $300 and multi-page websites at $600, with responsive design and on-page SEO included."
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Website Design &amp; Development Services | New Fleet Solutions" />
    <meta
      name="twitter:description"
      content="Get professional website design and development services from New Fleet Solutions. Affordable single-page websites starting at $300 and multi-page websites at $600, with responsive design and on-page SEO included."
    />

    <!-- Typography: Plus Jakarta Sans (Display) + Manrope (Body) + JetBrains Mono (Tabular Specs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Clean Brand Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFFFFF'/%3E%3Cpolygon points='5,13 26,6 26,18' fill='%232D1B8E'/%3E%3Cpolygon points='5,15 26,22 5,26' fill='%2325157A'/%3E%3C/svg%3E"
    />

    <!-- Schema.org Structured Data (ProfessionalService + OfferCatalog + FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "name": "New Fleet Solutions",
            "description": "Professional website design and development services including responsive single-page and multi-page websites with on-page SEO foundations.",
            "areaServed": "US",
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Website Design & Development Packages",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "name": "Single-Page Website",
                  "price": "300",
                  "priceCurrency": "USD",
                  "description": "One professionally designed responsive scrolling page with business introduction, services overview, contact form, and basic on-page SEO."
                },
                {
                  "@type": "Offer",
                  "name": "Multi-Page Website",
                  "price": "600",
                  "priceCurrency": "USD",
                  "description": "Complete multi-page website experience with up to 5 standard pages, dedicated service pages, navigation, contact forms, and on-page SEO."
                }
              ]
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How much does a website cost?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Single-page websites start at $300, while multi-page websites start at $600."
                }
              },
              {
                "@type": "Question",
                "name": "What is the difference between a single-page and multi-page website?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A single-page website presents all major information on one scrolling page, while a multi-page website separates content into dedicated pages."
                }
              },
              {
                "@type": "Question",
                "name": "Are websites mobile-friendly?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Both packages include responsive website design."
                }
              },
              {
                "@type": "Question",
                "name": "Is SEO included?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Basic on-page SEO setup is included in both packages."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Google Analytics 4 Integration Readiness (uncomment and add GA_MEASUREMENT_ID in production) -->

  </head>
  <body class="bg-white text-[#10152C] antialiased selection:bg-[#1B1A66] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
